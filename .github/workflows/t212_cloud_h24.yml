name: "🛡️ Trading 212 Autonomous Quant Bot V11.5 LTS (Cloud H24 Zero Cerotti)"

on:
  schedule:
    # Watchdog auto-riparante ogni 2 ore (Domenica sera -> Venerdì pomeriggio):
    # non usa lock di concorrenza; avvia la catena workflow_dispatch solo se nessuna sessione è già attiva!
    - cron: "15 18,20,22 * * 0"
    - cron: "15 0,2,4,6,7,8,10,12,14 * * 1-5"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Numero massimo di cicli da ~6s (2800 = ~5h20m continui senza buchi)"
        required: false
        default: "2800"
      relay_afternoon:
        description: "Lancia automaticamente il Turno Pomeridiano (12:25 -> 17:36 Europe/Rome) a fine sessione?"
        required: false
        default: "auto"

permissions:
  contents: write
  actions: write

jobs:
  watchdog-check:
    name: "🔍 Watchdog Anti-Coda Cron (Avvia catena H24 solo se ferma)"
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Rome
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: "⚡ Verifica catena workflow_dispatch attiva"
        run: |
          DOW=$(date +%u)
          HOUR=$(date +%H)
          MIN=$(date +%M)
          HM=$((10#$HOUR * 60 + 10#$MIN))

          # Finestra operativa catena H24: da Domenica 21:00 Europe/Rome fino a Venerdì 17:30 Europe/Rome
          if [ "$DOW" -eq 6 ] || { [ "$DOW" -eq 7 ] && [ "$HM" -lt 1260 ]; } || { [ "$DOW" -eq 5 ] && [ "$HM" -ge 1050 ]; }; then
            echo "🏖️ Finestra weekend (100% Cash EUR C1). Nessun avvio richiesto."
            exit 0
          fi

          ACTIVE_COUNT=$(gh run list --repo "${{ github.repository }}" --workflow "t212_cloud_h24.yml" --limit 10 --json event,status \
            --jq '[.[] | select(.event == "workflow_dispatch" and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending"))] | length')

          if [ "${ACTIVE_COUNT:-0}" -gt 0 ]; then
            echo "✅ Catena Cloud H24 già attiva ($ACTIVE_COUNT workflow_dispatch in corso). Uscita immediata a costo zero."
            exit 0
          fi

          echo "🚀 Nessuna sessione workflow_dispatch attiva rilevata ($(date)): riaccensione istantanea catena Cloud H24..."
          gh workflow run t212_cloud_h24.yml --repo "${{ github.repository }}"

  quant-bot-v11:
    name: "Motore Continuo & Ponte H24 V11.6 Zero Cerotti Anti-Spread (Lun-Ven)"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    concurrency:
      group: t212-quant-v11-cloud-runner
      cancel-in-progress: false
    env:
      TZ: Europe/Rome
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
      T212_MODE: ${{ secrets.T212_MODE }}

    steps:
      - name: "📥 Checkout Repository & Stato Portafoglio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📅 Calcola Chiave Cache Intraday (Staffetta Mattina -> Pomeriggio)"
        id: cache-key
        run: |
          echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: "♻️ Ripristina Cache Candele 5m & Radar dalla Sessione Precedente (Zero Cold-Start Staffetta 12:25)"
        uses: actions/cache/restore@v4
        with:
          path: |
            .scanner_5m_cache.json
            .radar_wave_cache.json
          key: t212-intraday-cache-${{ runner.os }}-${{ steps.cache-key.outputs.stamp }}
          restore-keys: |
            t212-intraday-cache-${{ runner.os }}-${{ steps.cache-key.outputs.today }}-

      - name: "🧪 Verifica Bloccante dei 34 Invarianti Matematici (V11.6 LTS Zero Cerotti Anti-Spread)"
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: "🛡️ Sessione Continua 6s + Ponte Notturno Autonomo Lun-Ven"
        id: run-session
        run: |
          git config user.name "t212-quant-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DOW=$(date +%u)
          HOUR=$(date +%H)
          MIN=$(date +%M)
          HM=$((10#$HOUR * 60 + 10#$MIN))

          # 1) Stop netto Weekend C1 (da Venerdì >= 17:36 fino a Domenica < 21:00 Europe/Rome)
          if [ "$DOW" -eq 6 ] || { [ "$DOW" -eq 7 ] && [ "$HM" -lt 1260 ]; } || { [ "$DOW" -eq 5 ] && [ "$HM" -ge 1056 ]; }; then
            echo "🏁 Fine settimana C1 (100% Cash EUR, ore $(date +%H:%M)). Catena a riposo fino a Domenica sera."
            echo "ran_session=false" >> "$GITHUB_OUTPUT"
            echo "relay_mode=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Ponte Notturno Autonomo (17:36 -> 08:45 Europe/Rome, zero dipendenza dalla coda cron di GitHub!):
          #    dorme leggero a 0 API calls per max 295m e passa il testimone via workflow_dispatch (<4s) fino alle 08:45 esatte,
          #    quando lancia una VM fresca da 330m dedicata al Turno Mattutino 08:50 -> 12:25!
          if [ "$HM" -ge 1056 ] || [ "$HM" -lt 525 ] || [ "$DOW" -eq 7 ]; then
            echo "🌙 Ponte Notturno Autonomo attivo ($(date '+%a %H:%M %Z')) -> presidio verso apertura 08:45 Europe/Rome..."
            echo "ran_session=false" >> "$GITHUB_OUTPUT"
            SLEPT_MIN=0
            while [ "$SLEPT_MIN" -lt 295 ]; do
              sleep 60
              SLEPT_MIN=$((SLEPT_MIN + 1))
              DOW=$(date +%u)
              HOUR=$(date +%H)
              MIN=$(date +%M)
              HM=$((10#$HOUR * 60 + 10#$MIN))
              if [ "$DOW" -le 5 ] && [ "$HM" -ge 525 ] && [ "$HM" -lt 1056 ]; then
                echo "☀️ Raggiunte le $(date +%H:%M) Europe/Rome! Lancio VM fresca dedicata al Turno Mattutino..."
                echo "relay_mode=fresh_morning" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            echo "🔄 Cambio turno Ponte Notturno dopo ${SLEPT_MIN}m ($(date +%H:%M) Europe/Rome)..."
            echo "relay_mode=night_bridge" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ran_session=true" >> "$GITHUB_OUTPUT"

          # 3) Pre-apertura breve (08:45 -> 08:50 Europe/Rome) sulla VM mattutina appena avviata
          while [ "$HM" -lt 530 ]; do
            echo "⏳ Pre-apertura Borsa ($(date +%H:%M) Europe/Rome < 08:50): attesa 20s..."
            sleep 20
            HOUR=$(date +%H)
            MIN=$(date +%M)
            HM=$((10#$HOUR * 60 + 10#$MIN))
          done

          git pull --rebase origin main || true

          TOTAL_CYCLES="${{ github.event.inputs.cycles || '2800' }}"
          RELAY_MODE="${{ github.event.inputs.relay_afternoon || 'auto' }}"
          BATCH=50
          DONE=0

          echo "🚀 Avvio Sessione Continua V11.6 Zero Cerotti per max $TOTAL_CYCLES cicli da 6s (Ora Borsa: $(date))"
          while [ "$DONE" -lt "$TOTAL_CYCLES" ]; do
            DOW=$(date +%u)
            HOUR=$(date +%H)
            MIN=$(date +%M)
            HM=$((10#$HOUR * 60 + 10#$MIN))

            # Chiusura seduta alle 17:36 Europe/Rome (1056 min):
            if [ "$HM" -ge 1056 ]; then
              echo "🏁 Borsa Europea chiusa (ore $(date +%H:%M)). Fine sessione giornaliera."
              break
            fi

            # Nel turno mattutino (RELAY_MODE != false), passa il testimone alle 12:25 (745 min) al Turno Pomeridiano
            if [ "$RELAY_MODE" != "false" ] && [ "$HM" -ge 745 ] && [ "$DONE" -ge 50 ]; then
              echo "🔄 Passaggio di testimone programmato delle $(date +%H:%M) al Turno Pomeridiano (fino alle 17:36)..."
              break
            fi

            python3 t212_daemon_100e.py --cycles "$BATCH"
            python3 t212-cli.py dashboard

            # Checkpoint atomico su GitHub: in rebase '-X theirs' preserva SEMPRE lo stato locale appena calcolato!
            git add trading212_state.json registro_fiscale_730.json dashboard_v6_5.html
            if ! git diff --cached --quiet; then
              git commit -m "chore(state): checkpoint V11.6 portafoglio & 730 ($(date +%H:%M) Europe/Rome) [skip ci]"
              if ! git push origin main; then
                git pull --rebase -X theirs origin main || git rebase --abort || true
                git push origin main || true
              fi
            fi

            DONE=$((DONE + BATCH))
          done

          python3 t212-cli.py status
          python3 t212-cli.py tax-730

          DOW=$(date +%u)
          HOUR=$(date +%H)
          MIN=$(date +%M)
          HM=$((10#$HOUR * 60 + 10#$MIN))
          if [ "$RELAY_MODE" != "false" ] && [ "$HM" -ge 735 ] && [ "$HM" -le 1005 ]; then
            echo "relay_mode=afternoon" >> "$GITHUB_OUTPUT"
          elif [ "$DOW" -le 4 ] && [ "$HM" -ge 1050 ]; then
            echo "relay_mode=night_bridge" >> "$GITHUB_OUTPUT"
          else
            echo "relay_mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: "💾 Salva Cache Candele 5m & Radar per la Staffetta Pomeridiana (Zero Git Bloat)"
        if: "!cancelled() && steps.run-session.outputs.ran_session == 'true' && hashFiles('.scanner_5m_cache.json') != ''"
        uses: actions/cache/save@v4
        with:
          path: |
            .scanner_5m_cache.json
            .radar_wave_cache.json
          key: t212-intraday-cache-${{ runner.os }}-${{ steps.cache-key.outputs.stamp }}

      - name: "🔁 Auto-Staffetta Perpetua Lun-Ven (Mattina -> Pomeriggio -> Ponte Notturno -> 08:45)"
        if: "!cancelled() && steps.run-session.outcome == 'success'"
        run: |
          MODE="${{ steps.run-session.outputs.relay_mode }}"
          HOUR=$(date +%H)
          MIN=$(date +%M)
          HM=$((10#$HOUR * 60 + 10#$MIN))

          if [ "$MODE" = "afternoon" ]; then
            REMAINING_MIN=$((1058 - HM))
            NEXT_CYCLES=$((REMAINING_MIN * 10 + 60))
            echo "⚡ Attivazione Staffetta Pomeridiana V11.5 ($NEXT_CYCLES cicli da 6s fino alle 17:36 Europe/Rome)..."
            gh workflow run t212_cloud_h24.yml --repo "${{ github.repository }}" -f cycles="$NEXT_CYCLES" -f relay_afternoon="false"
          elif [ "$MODE" = "night_bridge" ] || [ "$MODE" = "fresh_morning" ]; then
            echo "⚡ Attivazione Staffetta Automatica ($MODE alle $(date +%H:%M) Europe/Rome, 0s coda)..."
            gh workflow run t212_cloud_h24.yml --repo "${{ github.repository }}"
          else
            echo "⏹️ Nessuna staffetta successiva richiesta (mode=$MODE)."
          fi
