name: "🛡️ Trading 212 Autonomous Quant Bot V11.5 LTS (Cloud H24 Zero Cerotti)"

on:
  schedule:
    # Avvio DST-Safe alle 06:35 UTC (07:35 CET inverno / 08:35 CEST estate): sempre in anticipo sulle 09:00 Europe/Rome!
    - cron: "35 6 * * 1-5"
    # Watchdog di sicurezza non distruttivo (11:45 UTC = 12:45 CET / 13:45 CEST, cancel-in-progress: false)
    - cron: "45 11 * * 1-5"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Numero massimo di cicli da ~6s (2800 = ~5h20m continui senza buchi)"
        required: false
        default: "2800"
      relay_afternoon:
        description: "Lancia automaticamente il Turno Pomeridiano (12:25 -> 17:36 Europe/Rome) a fine sessione?"
        required: false
        default: "auto"

concurrency:
  group: t212-quant-v11-cloud-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  quant-bot-v11:
    name: "Motore Continuo V11.5 Zero Cerotti (09:00-17:36 Europe/Rome)"
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TZ: Europe/Rome
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      T212_API_KEY: ${{ secrets.T212_API_KEY }}
      T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
      T212_MODE: ${{ secrets.T212_MODE }}

    steps:
      - name: "📥 Checkout Repository & Stato Portafoglio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "📅 Calcola Chiave Cache Intraday (Staffetta Mattina -> Pomeriggio)"
        id: cache-key
        run: |
          echo "today=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "stamp=$(date +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: "♻️ Ripristina Cache Candele 5m & Radar dalla Sessione Precedente (Zero Cold-Start Staffetta 12:25)"
        uses: actions/cache/restore@v4
        with:
          path: |
            .scanner_5m_cache.json
            .radar_wave_cache.json
          key: t212-intraday-cache-${{ runner.os }}-${{ steps.cache-key.outputs.stamp }}
          restore-keys: |
            t212-intraday-cache-${{ runner.os }}-${{ steps.cache-key.outputs.today }}-

      - name: "🧪 Verifica Bloccante dei 30 Invarianti Matematici (V11.5 LTS Cross-Model Converged)"
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: "🛡️ Sessione Continua 6s (MiFID Limit +1% + Cache 5m Persistente + Checkpoint Git)"
        id: run-session
        run: |
          git config user.name "t212-quant-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          HOUR=$(date +%H)
          MIN=$(date +%M)
          HM=$((10#$HOUR * 60 + 10#$MIN))
          if [ "$HM" -ge 1056 ]; then
            echo "🏁 Borsa Europea già chiusa (ore $(date +%H:%M) Europe/Rome). Uscita immediata watchdog."
            echo "ran_session=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ran_session=true" >> "$GITHUB_OUTPUT"

          # Attesa leggera pre-apertura fino alle 08:50 Europe/Rome (530 min) in inverno (CET)
          while [ "$HM" -lt 530 ]; do
            echo "⏳ Pre-apertura Borsa ($(date +%H:%M) Europe/Rome < 08:50): attesa 30s..."
            sleep 30
            HOUR=$(date +%H)
            MIN=$(date +%M)
            HM=$((10#$HOUR * 60 + 10#$MIN))
          done

          git pull --rebase origin main || true

          TOTAL_CYCLES="${{ github.event.inputs.cycles || '2800' }}"
          RELAY_MODE="${{ github.event.inputs.relay_afternoon || 'auto' }}"
          BATCH=50
          DONE=0

          echo "🚀 Avvio Sessione Continua V11.5 Zero Cerotti per max $TOTAL_CYCLES cicli da 6s (Ora Borsa: $(date))"
          while [ "$DONE" -lt "$TOTAL_CYCLES" ]; do
            HOUR=$(date +%H)
            MIN=$(date +%M)
            HM=$((10#$HOUR * 60 + 10#$MIN))

            # Se sono passate le 17:36 Europe/Rome (1056 min), la Borsa Europea è chiusa: termina il turno
            if [ "$HM" -ge 1056 ]; then
              echo "🏁 Borsa Europea chiusa (ore $(date +%H:%M)). Fine sessione giornaliera."
              break
            fi

            # Nel turno mattutino (RELAY_MODE != false), passa il testimone alle 12:25 (745 min, in piena Pausa Pranzo) ben prima del timeout 330m
            if [ "$RELAY_MODE" != "false" ] && [ "$HM" -ge 745 ] && [ "$DONE" -ge 50 ]; then
              echo "🔄 Passaggio di testimone programmato delle $(date +%H:%M) al Turno Pomeridiano (311m fino alle 17:36)..."
              break
            fi

            python3 t212_daemon_100e.py --cycles "$BATCH"
            python3 t212-cli.py dashboard

            # Checkpoint atomico su GitHub: in rebase '-X theirs' preserva SEMPRE lo stato locale appena calcolato!
            git add trading212_state.json registro_fiscale_730.json dashboard_v6_5.html
            if ! git diff --cached --quiet; then
              git commit -m "chore(state): checkpoint V11.5 portafoglio & 730 ($(date +%H:%M) Europe/Rome) [skip ci]"
              if ! git push origin main; then
                git pull --rebase -X theirs origin main || git rebase --abort || true
                git push origin main || true
              fi
            fi

            DONE=$((DONE + BATCH))
          done

          python3 t212-cli.py status
          python3 t212-cli.py tax-730

      - name: "💾 Salva Cache Candele 5m & Radar per la Staffetta Pomeridiana (Zero Git Bloat)"
        if: "!cancelled() && steps.run-session.outputs.ran_session == 'true' && hashFiles('.scanner_5m_cache.json') != ''"
        uses: actions/cache/save@v4
        with:
          path: |
            .scanner_5m_cache.json
            .radar_wave_cache.json
          key: t212-intraday-cache-${{ runner.os }}-${{ steps.cache-key.outputs.stamp }}

      - name: "🔁 Auto-Staffetta Istantanea Turno Pomeridiano (12:25 -> 17:36 Europe/Rome)"
        if: "!cancelled()"
        run: |
          HOUR=$(date +%H)
          MIN=$(date +%M)
          HM=$((10#$HOUR * 60 + 10#$MIN))
          RELAY="${{ github.event.inputs.relay_afternoon || 'auto' }}"

          # Se siamo tra le 12:15 e le 16:45 Europe/Rome, lancia via workflow_dispatch il turno pomeridiano continuo fino alle 17:36
          if [ "$RELAY" != "false" ] && [ "$HM" -ge 735 ] && [ "$HM" -le 1005 ]; then
            REMAINING_MIN=$((1058 - HM))
            NEXT_CYCLES=$((REMAINING_MIN * 10 + 60))
            echo "⚡ Attivazione Staffetta Pomeridiana V11.5 ($NEXT_CYCLES cicli da 6s fino alle 17:36 Europe/Rome)..."
            gh workflow run t212_cloud_h24.yml --repo "${{ github.repository }}" -f cycles="$NEXT_CYCLES" -f relay_afternoon="false" || true
          fi
